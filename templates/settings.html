<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <img src="{{ url_for('static', filename='images/logo.png') }}" class="logo" alt="Zebra Safety Services">
        <nav>
            <a href="{{ url_for('admin') }}">📊 Dashboard</a>
            <a href="{{ url_for('registrants') }}">👤 Registrants</a>
            <a href="{{ url_for('settings') }}" class="active">⚙ Settings</a>
        </nav>
        <form method="post" action="{{ url_for('logout') }}" class="logout-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="logout">🚪 Logout</button>
        </form>
    </aside>
    <main class="main">
        <header class="header"><h2>Settings</h2></header>
        <div class="card">
            <h3>Account security</h3>
            <p>Change your administrator password regularly and use a unique password.</p>
            <a href="{{ url_for('change_password') }}" class="btn primary">Change Password</a>
        </div>
    </main>
</div>
</body>
</html>
