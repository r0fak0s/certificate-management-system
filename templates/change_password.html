<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-container">
    <h2>Change Password</h2>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="password" name="old_password" placeholder="Current password" autocomplete="current-password" required>
        <input type="password" name="new_password" placeholder="New password (12+ characters)" autocomplete="new-password" minlength="12" required>
        <button type="submit">Update Password</button>
    </form>
    <p><a href="{{ url_for('settings') }}">Back to settings</a></p>
</div>
</body>
</html>
